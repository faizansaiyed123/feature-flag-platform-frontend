name: Full-stack quality and browser verification

on:
  push:
    branches: [main, 'chore/format-cleanup-*']
  pull_request:

concurrency:
  group: flagship-full-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip visuals]')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feature_flags
          POSTGRES_PASSWORD: feature_flags
          POSTGRES_DB: feature_flags_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feature_flags -d feature_flags_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/feature-flag-platform-backend
          path: backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pytest>=8.3,<10" "pytest-asyncio>=1,<2" "ruff>=0.13,<1"

      - name: Backend lint and tests
        working-directory: backend
        env:
          APP_ENV: test
          AUTH_SECRET_KEY: ci-only-feature-flag-platform-secret-32-chars
          DATABASE_URL: postgresql+psycopg://feature_flags:feature_flags@127.0.0.1:5432/feature_flags_test
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
        run: |
          ruff check app migrations tests
          pytest -q
          python -m compileall app tests
          alembic heads

      - name: Run database migrations
        working-directory: backend
        env:
          APP_ENV: development
          AUTH_SECRET_KEY: ci-only-feature-flag-platform-secret-32-chars
          DATABASE_URL: postgresql+psycopg://feature_flags:feature_flags@127.0.0.1:5432/feature_flags_test
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          APP_ENV: development
          AUTH_SECRET_KEY: ci-only-feature-flag-platform-secret-32-chars
          DATABASE_URL: postgresql+psycopg://feature_flags:feature_flags@127.0.0.1:5432/feature_flags_test
          CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../backend.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend
        run: npm ci

      - name: Apply Prettier formatting (temporary maintenance pass)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'chore/format-cleanup-')
        run: |
          npx --yes prettier@3.9.10 --write --print-width 100 --trailing-comma all --end-of-line lf "src/**/*.{ts,tsx,css}" "e2e/**/*.ts" "playwright.config.ts" "next.config.ts" "eslint.config.mjs"
          npx --yes prettier@3.9.10 --check --print-width 100 --trailing-comma all --end-of-line lf "src/**/*.{ts,tsx,css}" "e2e/**/*.ts" "playwright.config.ts" "next.config.ts" "eslint.config.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src" "e2e" "playwright.config.ts" "next.config.ts" "eslint.config.mjs"
          if git diff --cached --quiet; then
            echo "Formatting already up to date."
            exit 0
          fi
          git commit -m "style: format frontend sources with Prettier [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Frontend lint
        run: npm run lint

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

      - name: Start frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat frontend.log
          exit 1

      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium

      - name: Run full-stack browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-browser-evidence
          path: |
            docs/testing/visuals/*.png
            playwright-report/
            test-results/
            backend.log
            frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified walkthrough screenshots
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          images = sorted(Path("docs/testing/visuals").glob("*.png"))
          manifest = {
              "description": "Screenshots captured after successful product assertions in the full-stack Playwright flow.",
              "screenshots": [str(path) for path in images],
          }
          Path("docs/testing/visuals/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add docs/testing/visuals
          if git diff --cached --quiet; then
            echo "No visual changes to publish."
            exit 0
          fi
          git commit -m "docs: publish verified product walkthrough screenshots [skip visuals]"
          git push origin main

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-service-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: ignore
          retention-days: 14
